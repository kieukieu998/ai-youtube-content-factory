{% extends "base.html" %}

{% block title %}Cấu Hình Hệ Thống — AI Movie Content Factory{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-white">Cấu Hình Hệ Thống</h1>
        <p class="text-slate-400 text-sm">Thiết lập AI Providers, giọng đọc TTS, chế độ phê duyệt và các van an toàn.</p>
    </div>

    <form id="settings_form" onsubmit="saveSettings(event)" class="space-y-6">
        
        <!-- AI Engine Settings -->
        <div class="glass-card p-6 rounded-2xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <i data-lucide="brain" class="w-5 h-5 text-indigo-400"></i> AI Provider & API Keys
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label"><span class="label-text text-slate-300 font-semibold">AI Provider Mặc Định:</span></label>
                    <select name="default_ai_provider" class="select select-bordered bg-slate-900 text-white w-full">
                        <option value="gemini_free" {% if settings.default_ai_provider == 'gemini_free' %}selected{% endif %}>Google Gemini (Gói Miễn Phí Free Tier 100%)</option>
                        <option value="deepseek" {% if settings.default_ai_provider == 'deepseek' %}selected{% endif %}>DeepSeek API (Mở rộng)</option>
                        <option value="openai" {% if settings.default_ai_provider == 'openai' %}selected{% endif %}>OpenAI ChatGPT (Mở rộng)</option>
                    </select>
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text text-slate-300 font-semibold">Chế Độ Vận Hành:</span></label>
                    <select name="operation_mode" class="select select-bordered bg-slate-900 text-white w-full">
                        <option value="semi_auto" {% if settings.operation_mode == 'semi_auto' %}selected{% endif %}>Semi-Auto (Bán tự động — Duyệt Hook trước khi render)</option>
                        <option value="full_auto" {% if settings.operation_mode == 'full_auto' %}selected{% endif %}>Full-Auto (Tự động 100% từ A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="form-control">
                <label class="label">
                    <span class="label-text text-slate-300 font-semibold">Google Gemini API Key:</span>
                    <a href="https://aistudio.google.com/" target="_blank" class="label-text-alt text-indigo-400 hover:underline">Lấy Key miễn phí tại Google AI Studio &rarr;</a>
                </label>
                <input type="password" name="gemini_api_key" value="{{ gemini_api_key }}" placeholder="AIzaSy..." class="input input-bordered bg-slate-900 text-white font-mono w-full" />
            </div>
        </div>

        <!-- TTS Voice Settings -->
        <div class="glass-card p-6 rounded-2xl space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <i data-lucide="mic" class="w-5 h-5 text-rose-400"></i> Giọng Đọc Lồng Tiếng (Edge-TTS Miễn Phí)
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="form-control">
                    <label class="label"><span class="label-text text-slate-300 font-semibold">Giọng Đọc Mặc Định:</span></label>
                    <select name="default_tts_voice" class="select select-bordered bg-slate-900 text-white w-full">
                        <option value="vi-VN-HoaiMyNeural" {% if settings.default_tts_voice == 'vi-VN-HoaiMyNeural' %}selected{% endif %}>vi-VN-HoaiMyNeural (Nữ miền Bắc truyền cảm)</option>
                        <option value="vi-VN-NamMinhNeural" {% if settings.default_tts_voice == 'vi-VN-NamMinhNeural' %}selected{% endif %}>vi-VN-NamMinhNeural (Nam miền Bắc trầm ấm)</option>
                    </select>
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text text-slate-300 font-semibold">Van Khóa Ngân Sách ($/Ngày):</span></label>
                    <input type="number" name="daily_budget_limit_usd" value="{{ settings.daily_budget_limit_usd or '0.0' }}" step="0.5" min="0" class="input input-bordered bg-slate-900 text-white font-mono w-full" />
                    <label class="label"><span class="label-text-alt text-slate-500">Đặt 0.0 nếu dùng gói Gemini Free</span></label>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <div class="flex justify-end gap-3">
            <button type="submit" class="btn btn-primary px-8 shadow-lg shadow-indigo-600/30">
                <i data-lucide="save" class="w-4 h-4"></i> Lưu Cấu Hình
            </button>
        </div>
    </form>
</div>

<script>
    function saveSettings(e) {
        e.preventDefault();
        const formData = new FormData(e.target);

        $.ajax({
            url: '/api/v1/settings/save',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            success: function(res) {
                Swal.fire('Thành công!', res.message, 'success');
            },
            error: function(err) {
                Swal.fire('Lỗi', 'Không thể lưu cấu hình', 'error');
            }
        });
    }
</script>
{% endblock %}
